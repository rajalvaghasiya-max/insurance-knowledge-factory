name: Factory CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 · pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create isolated test environment
        run: python -m venv .ci-venv

      - name: Install declared dependencies only
        run: .ci-venv/bin/python -m pip install --requirement requirements.txt

      - name: Verify dependency consistency
        run: .ci-venv/bin/python -m pip check

      - name: Validate capability control plane
        run: .ci-venv/bin/python -m scripts.check_capability_control

      - name: Bootstrap updated capability fingerprint baseline
        run: .ci-venv/bin/python -m scripts.check_capability_fingerprints --emit-baseline

      - name: Run Factory test suite
        run: .ci-venv/bin/python -m pytest -q
