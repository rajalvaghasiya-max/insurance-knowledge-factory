name: Factory CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Python 3.13 · pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create isolated test environment
        run: python -m venv .ci-venv

      - name: Install declared dependencies only
        run: .ci-venv/bin/python -m pip install --requirement requirements.txt

      - name: Verify dependency consistency
        run: .ci-venv/bin/python -m pip check

      - name: Validate capability control plane
        run: .ci-venv/bin/python -m scripts.check_capability_control

      - name: Reconcile committed capability impact against PR evidence
        if: github.event_name == 'pull_request'
        run: >-
          .ci-venv/bin/python -m scripts.check_capability_impact
          --base-ref "${{ github.event.pull_request.base.sha }}"
          --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Validate capability implementation fingerprints
        run: .ci-venv/bin/python -m scripts.check_capability_fingerprints

      - name: Materialize exact generated capability map
        run: .ci-venv/bin/python -m scripts.check_generated_capability_map --emit > docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md

      - name: Commit exact generated capability map
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md
          git commit -m "Regenerate capability map for entity resolution census"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Run Factory test suite
        run: .ci-venv/bin/python -m pytest -q
