name: Factory CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 · pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create isolated test environment
        run: python -m venv .ci-venv

      - name: Install declared dependencies only
        run: .ci-venv/bin/python -m pip install --requirement requirements.txt

      - name: Verify dependency consistency
        run: .ci-venv/bin/python -m pip check

      - name: Install frozen browser transport runtime
        run: .ci-venv/bin/python -m playwright install --with-deps chromium

      - name: Product 11 Gate B source-specific blind directory smoke
        shell: bash
        run: |
          xvfb-run -a .ci-venv/bin/python - <<'PY'
          import contextlib
          import hashlib
          import io
          import json
          import re
          import tempfile
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          from bs4 import BeautifulSoup

          from agents.discovery_agent import DiscoveryAgent
          from collectors.capture_engine import CaptureEngine
          from factory_core.governance.blind_discovery_link_projection import (
              BlindDiscoveryLinkProjectionError,
              BlindDiscoveryLinkProjector,
          )
          from scripts.run_source_discovery import SourceDiscoveryRunner

          passing_roots = [
              "https://irdai.gov.in/non-life-insurers1",
              "https://irdai.gov.in/health-insurers1",
          ]
          candidates = {
              "chola": "Cholamandalam MS General Insurance Company Limited",
              "magma": "Magma General Insurance Limited",
              "navi": "Navi General Insurance Limited",
              "shriram": "Shriram General Insurance Company Limited",
          }
          identity_stopwords = {
              "insurance", "general", "company", "limited", "ltd", "co",
              "the", "of", "india",
          }
          excluded_external_hosts = {
              "facebook.com", "linkedin.com", "youtube.com", "youtu.be",
              "twitter.com", "x.com", "instagram.com", "google.com",
              "google.co.in", "goo.gl",
          }

          capture_engine = CaptureEngine()
          capture_engine.capture_screenshot_only = lambda _url: None
          discovery_agent = DiscoveryAgent()
          source_runner = SourceDiscoveryRunner()

          def opaque(value: str) -> str:
              return "sha256:" + hashlib.sha256(value.encode("utf-8")).hexdigest()

          def host_key(url: str) -> str:
              host = (urlparse(url).hostname or "").lower().strip(".")
              return host[4:] if host.startswith("www.") else host

          def is_irdai(url: str) -> bool:
              host = host_key(url)
              return host == "irdai.gov.in" or host.endswith(".irdai.gov.in")

          def identity_tokens(value: str) -> set[str]:
              tokens = set(re.findall(r"[a-z0-9]+", value.lower()))
              return {token for token in tokens if token not in identity_stopwords}

          candidate_tokens = {
              candidate_id: identity_tokens(name)
              for candidate_id, name in candidates.items()
          }

          def matches_candidate(candidate_id: str, surface: str) -> bool:
              required = candidate_tokens[candidate_id]
              return bool(required) and required.issubset(identity_tokens(surface))

          def suppressed_capture(url: str) -> dict:
              sink = io.StringIO()
              with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                  return capture_engine.capture(url)

          def candidate_external_hosts(soup: BeautifulSoup, page_url: str) -> dict[str, set[str]]:
              found = {candidate_id: set() for candidate_id in candidates}
              containers = soup.find_all(["tr", "li", "article", "section", "div"])
              for container in containers:
                  text = container.get_text(" ", strip=True)
                  matching = [
                      candidate_id
                      for candidate_id in candidates
                      if matches_candidate(candidate_id, text)
                  ]
                  if len(matching) != 1:
                      continue
                  candidate_id = matching[0]
                  for link in container.find_all("a"):
                      href = link.get("href")
                      if not href:
                          continue
                      absolute = urljoin(page_url, href)
                      parsed = urlparse(absolute)
                      if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                          continue
                      host = host_key(absolute)
                      if is_irdai(absolute) or host in excluded_external_hosts:
                          continue
                      found[candidate_id].add(host)
              return found

          def candidate_internal_pages(soup: BeautifulSoup, page_url: str) -> dict[str, set[str]]:
              found = {candidate_id: set() for candidate_id in candidates}
              for link in soup.find_all("a"):
                  href = link.get("href")
                  if not href:
                      continue
                  absolute = urljoin(page_url, href)
                  parsed = urlparse(absolute)
                  if parsed.scheme not in {"http", "https"} or not parsed.netloc or not is_irdai(absolute):
                      continue
                  surface = f"{link.get_text(' ', strip=True)} {parsed.path}"
                  matching = [
                      candidate_id
                      for candidate_id in candidates
                      if matches_candidate(candidate_id, surface)
                  ]
                  if len(matching) == 1:
                      found[matching[0]].add(absolute)
              return found

          root_audit = []
          directory_projection_records = []
          raw_directory_destinations = {}

          for root in passing_roots:
              capture = suppressed_capture(root)
              valid = capture_engine.is_valid_capture(capture)
              root_audit.append({
                  "root_id": opaque(root),
                  "accepted": bool(valid),
                  "capture_strategy": capture.get("capture_strategy"),
                  "capture_strategy_attempted": capture.get("capture_strategy_attempted", []),
              })
              if not valid:
                  continue
              soup = BeautifulSoup(capture.get("html", ""), "lxml")
              for link in soup.find_all("a"):
                  href = link.get("href")
                  if not href:
                      continue
                  absolute = urljoin(root, href)
                  parsed = urlparse(absolute)
                  if parsed.scheme not in {"http", "https"} or not parsed.netloc or not is_irdai(absolute):
                      continue
                  anchor = link.get_text(" ", strip=True)
                  if source_runner.source_noise_skip_reason(absolute, anchor):
                      continue
                  page_type = source_runner.classify_source_url(absolute, anchor, "regulator")
                  if page_type != "insurer_directory":
                      continue
                  record = {
                      "source_id": "irdai_regulator",
                      "insurer_id": "irdai_regulator",
                      "source_url": root,
                      "discovered_url": absolute,
                      "anchor_text": anchor,
                      "page_type": page_type,
                      "knowledge_value": source_runner.assign_source_knowledge_value(page_type),
                      "crawl": True,
                      "priority": source_runner.assign_source_priority(page_type, "high", 2),
                      "status": "new",
                      "discovery_origin": "captured_html",
                  }
                  try:
                      projection = BlindDiscoveryLinkProjector.project(record).to_dict()
                  except BlindDiscoveryLinkProjectionError:
                      continue
                  destination_id = projection["destination_id"]
                  raw_directory_destinations[destination_id] = absolute
                  directory_projection_records.append(projection)

          # Deduplicate selector-facing directory projections without exposing destinations.
          directory_projection_records = sorted(
              {item["destination_id"]: item for item in directory_projection_records}.values(),
              key=lambda item: item["destination_id"],
          )

          external_hosts = {candidate_id: set() for candidate_id in candidates}
          internal_pages = {candidate_id: set() for candidate_id in candidates}
          directory_capture_count = 0
          for projection in directory_projection_records[:40]:
              raw_url = raw_directory_destinations[projection["destination_id"]]
              capture = suppressed_capture(raw_url)
              if not capture_engine.is_valid_capture(capture):
                  continue
              directory_capture_count += 1
              soup = BeautifulSoup(capture.get("html", ""), "lxml")
              direct = candidate_external_hosts(soup, raw_url)
              internal = candidate_internal_pages(soup, raw_url)
              for candidate_id in candidates:
                  external_hosts[candidate_id].update(direct[candidate_id])
                  internal_pages[candidate_id].update(internal[candidate_id])

          # Follow at most two regulator-internal candidate-specific pages per candidate.
          # This is still regulator-derived machine-side identity routing, not product screening.
          for candidate_id in sorted(candidates):
              for raw_url in sorted(internal_pages[candidate_id])[:2]:
                  capture = suppressed_capture(raw_url)
                  if not capture_engine.is_valid_capture(capture):
                      continue
                  soup = BeautifulSoup(capture.get("html", ""), "lxml")
                  direct = candidate_external_hosts(soup, raw_url)
                  external_hosts[candidate_id].update(direct[candidate_id])

          resolved_origins = {}
          resolution_audit = {}
          for candidate_id in sorted(candidates):
              hosts = sorted(external_hosts[candidate_id])
              if len(hosts) == 1:
                  origin = "https://" + hosts[0] + "/"
                  resolved_origins[candidate_id] = origin
                  resolution_audit[candidate_id] = {
                      "resolved": True,
                      "origin_id": opaque(origin),
                      "candidate_external_host_count": 1,
                  }
              else:
                  resolution_audit[candidate_id] = {
                      "resolved": False,
                      "origin_id": None,
                      "candidate_external_host_count": len(hosts),
                  }

          insurer_capture_audit = {}
          projections_by_candidate = {}
          with tempfile.TemporaryDirectory() as tmpdir:
              for candidate_id in sorted(resolved_origins):
                  origin = resolved_origins[candidate_id]
                  capture = suppressed_capture(origin)
                  valid = capture_engine.is_valid_capture(capture)
                  insurer_capture_audit[candidate_id] = {
                      "accepted": bool(valid),
                      "origin_id": opaque(origin),
                      "capture_strategy": capture.get("capture_strategy"),
                      "capture_strategy_attempted": capture.get("capture_strategy_attempted", []),
                  }
                  if not valid:
                      projections_by_candidate[candidate_id] = []
                      continue

                  html_path = Path(tmpdir) / f"insurer-{candidate_id}.html"
                  html_path.write_text(capture.get("html", ""), encoding="utf-8")
                  sink = io.StringIO()
                  with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                      discovered = discovery_agent.discover_from_html_file(
                          insurer_id=candidate_id,
                          source_url=origin,
                          html_path=str(html_path),
                      )

                  projected = []
                  for raw_record in discovered:
                      record = dict(raw_record)
                      record["discovery_origin"] = "captured_html"
                      destination = record.get("discovered_url", "")
                      if host_key(destination) != host_key(origin):
                          continue
                      try:
                          projection = BlindDiscoveryLinkProjector.project(record).to_dict()
                      except BlindDiscoveryLinkProjectionError:
                          continue
                      projected.append(projection)
                  projections_by_candidate[candidate_id] = sorted(
                      {item["destination_id"]: item for item in projected}.values(),
                      key=lambda item: (item["priority"], item["destination_id"]),
                  )

          passing_candidates = sorted(
              candidate_id
              for candidate_id, items in projections_by_candidate.items()
              if items
          )
          summary = {
              "decision": "PASS" if passing_candidates else "FAIL",
              "passing_candidate_ids": passing_candidates,
              "passing_candidate_count": len(passing_candidates),
              "directory_projection_count": len(directory_projection_records),
              "directory_capture_count": directory_capture_count,
              "resolved_candidate_count": len(resolved_origins),
              "resolved_candidate_ids": sorted(resolved_origins),
              "raw_regulator_destination_urls_emitted": 0,
              "raw_insurer_origins_emitted": 0,
              "raw_insurer_destination_urls_emitted": 0,
              "anchor_text_emitted": 0,
              "body_text_emitted": 0,
              "page_titles_emitted": 0,
              "screenshots_emitted": 0,
              "product_screening_started": False,
              "product_selected": False,
              "target_clause_reads": 0,
              "gate_c_started": False,
          }

          print("PRODUCT11_GATE_B_ROOT_AUDIT=" + json.dumps(root_audit, sort_keys=True))
          print("PRODUCT11_GATE_B_DIRECTORY=" + json.dumps({
              "projection_count": len(directory_projection_records),
              "capture_count": directory_capture_count,
              "page_type": "insurer_directory",
              "classification_authority": "SourceDiscoveryRunner",
              "raw_destination_urls_emitted": 0,
          }, sort_keys=True))
          print("PRODUCT11_GATE_B_RESOLUTION=" + json.dumps(resolution_audit, sort_keys=True))
          print("PRODUCT11_GATE_B_INSURER_CAPTURE_AUDIT=" + json.dumps(insurer_capture_audit, sort_keys=True))
          for candidate_id in sorted(projections_by_candidate):
              print("PRODUCT11_GATE_B_BLIND_PROJECTIONS=" + json.dumps({
                  "candidate_id": candidate_id,
                  "projection_count": len(projections_by_candidate[candidate_id]),
                  "projections": projections_by_candidate[candidate_id],
              }, sort_keys=True))
          print("PRODUCT11_GATE_B_SUMMARY=" + json.dumps(summary, sort_keys=True))
          PY

      - name: Run Factory test suite
        run: .ci-venv/bin/python -m pytest -q
