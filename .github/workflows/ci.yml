name: Factory CI

on:
  push:
    branches:
      - "platform-strict-enforcement-v1"

permissions:
  contents: write

jobs:
  bootstrap-generated-map:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create isolated test environment
        run: python -m venv .ci-venv

      - name: Install declared dependencies only
        run: .ci-venv/bin/python -m pip install --requirement requirements.txt

      - name: Validate strict capability control and fingerprints
        run: |
          .ci-venv/bin/python -m scripts.check_capability_control
          .ci-venv/bin/python -m scripts.check_capability_fingerprints

      - name: Regenerate deterministic capability map
        run: .ci-venv/bin/python -m scripts.check_generated_capability_map --emit > docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md

      - name: Commit generated map only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate capability map for STRICT enforcement"
          git push origin HEAD:platform-strict-enforcement-v1
