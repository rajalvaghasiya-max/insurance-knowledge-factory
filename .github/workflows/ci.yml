name: Factory CI

on:
  push:
    branches:
      - "platform-benefits-census-v1"

permissions:
  contents: write

jobs:
  bootstrap-generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Create isolated test environment
        run: python -m venv .ci-venv

      - name: Install declared dependencies only
        run: .ci-venv/bin/python -m pip install --requirement requirements.txt

      - name: Verify zero unclaimed governed intelligence files
        run: .ci-venv/bin/python -m scripts.check_capability_control

      - name: Regenerate deterministic fingerprints and capability map
        run: |
          .ci-venv/bin/python -m scripts.check_capability_fingerprints --emit-baseline > governance/capabilities/generated/structural_fingerprints.json
          .ci-venv/bin/python -m scripts.check_generated_capability_map --emit > docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md

      - name: Commit generated artifacts only
        run: |
          if git diff --quiet -- governance/capabilities/generated/structural_fingerprints.json docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md; then
            echo "Generated artifacts already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/capabilities/generated/structural_fingerprints.json docs/architecture/generated/POLICYSCNA_CAPABILITY_MAP.md
          git commit -m "Regenerate capability artifacts for Benefits census"
          git push origin HEAD:platform-benefits-census-v1
