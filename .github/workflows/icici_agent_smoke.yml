name: ICICI Agent Smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install declared dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Install Chromium for existing preservation agent
        run: python -m playwright install --with-deps chromium

      - name: Seed only selected ICICI Arogya product page
        shell: bash
        run: |
          mkdir -p discovery/url_queue
          cat > discovery/url_queue/icici_lombard_arogya_discovered_urls.json <<'JSON'
          [
            {
              "insurer_id": "icici_lombard",
              "source_url": "https://www.icicilombard.com/health-insurance/arogya-sanjeevani-policy",
              "discovered_url": "https://www.icicilombard.com/health-insurance/arogya-sanjeevani-policy",
              "anchor_text": "Arogya Sanjeevani Policy",
              "page_type": "product_page",
              "knowledge_value": "high",
              "crawl": true,
              "priority": 1,
              "status": "new",
              "discovery_origin": "product7_smoke_seed"
            }
          ]
          JSON

      - name: Run existing webpage preservation pipeline
        run: python -m scripts.run_queue_capture

      - name: Run existing HTML sectioning
        if: always()
        run: python -m scripts.run_html_sectioning

      - name: Run existing product signal extraction
        if: always()
        continue-on-error: true
        run: python -m scripts.run_product_signal_extraction

      - name: Run existing PDF discovery from captured HTML
        if: always()
        continue-on-error: true
        run: python -m scripts.run_pdf_discovery

      - name: Seed selected authoritative wording for downloader-only smoke
        if: always()
        shell: bash
        run: |
          mkdir -p discovery/pdf_queue
          cat > discovery/pdf_queue/icici_lombard_direct_smoke_pdf_urls.json <<'JSON'
          {
            "insurer_id": "icici_lombard_direct_smoke",
            "items": [
              {
                "insurer_id": "icici_lombard_direct_smoke",
                "document_type": "policy_wording",
                "url": "https://www.icicilombard.com/docs/default-source/default-document-library/arogya-sanjeevani-icici-lombard.pdf",
                "source_page_url": "https://www.icicilombard.com/health-insurance/arogya-sanjeevani-policy",
                "confidence_score": 1.0
              }
            ]
          }
          JSON

      - name: Run existing PDF download and binary hashing
        if: always()
        continue-on-error: true
        run: python -m scripts.run_pdf_download

      - name: Build smoke inventory and print capture metadata
        if: always()
        shell: bash
        run: |
          echo '=== queue ==='
          cat discovery/url_queue/icici_lombard_arogya_discovered_urls.json || true
          echo '=== capture metadata ==='
          find archive/metadata/icici_lombard -type f -name '*.json' -print -exec cat {} \; 2>/dev/null || true
          echo '=== archive files ==='
          find archive -type f -maxdepth 6 -print 2>/dev/null | sort || true
          echo '=== parsed files ==='
          find parsed -type f -maxdepth 6 -print 2>/dev/null | sort || true
          echo '=== signals files ==='
          find signals -type f -maxdepth 6 -print 2>/dev/null | sort || true
          echo '=== pdf queue ==='
          find discovery/pdf_queue -type f -maxdepth 3 -print -exec cat {} \; 2>/dev/null || true
          echo '=== raw pdf hashes ==='
          find archive/raw_pdf -type f -name '*.pdf' -print0 2>/dev/null | xargs -0 -r sha256sum || true
          echo '=== pdf registry ==='
          cat registry/pdf_registry.json 2>/dev/null || true

      - name: Upload generated acquisition artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icici-arogya-agent-smoke
          if-no-files-found: warn
          retention-days: 7
          path: |
            discovery/url_queue/icici_lombard_arogya_discovered_urls.json
            discovery/pdf_queue/**
            archive/raw_html/icici_lombard/**
            archive/text/icici_lombard/**
            archive/screenshots/icici_lombard/**
            archive/metadata/icici_lombard/**
            archive/raw_pdf/icici_lombard/**
            archive/raw_pdf/icici_lombard_direct_smoke/**
            parsed/html_sections/icici_lombard/**
            signals/product_signals/icici_lombard/**
            registry/pdf_registry.json
            logs/**
