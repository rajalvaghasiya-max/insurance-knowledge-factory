name: Product11 Gate B Origin Signal Diagnostic

on:
  push:
    branches: [product11-gate-b-origin-signal-diagnostic]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m venv .ci-venv
      - run: .ci-venv/bin/python -m pip install --requirement requirements.txt
      - run: .ci-venv/bin/python -m playwright install --with-deps chromium
      - name: Machine-only origin representation diagnostic
        shell: bash
        run: |
          xvfb-run -a .ci-venv/bin/python - <<'PY'
          import contextlib, hashlib, io, json, re
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup
          from collectors.capture_engine import CaptureEngine
          from factory_core.governance.blind_discovery_link_projection import BlindDiscoveryLinkProjector
          from scripts.run_source_discovery import SourceDiscoveryRunner

          roots = [
              "https://irdai.gov.in/non-life-insurers1",
              "https://irdai.gov.in/health-insurers1",
          ]
          candidates = {
              "chola": "Cholamandalam MS General Insurance Company Limited",
              "magma": "Magma General Insurance Limited",
              "navi": "Navi General Insurance Limited",
              "shriram": "Shriram General Insurance Company Limited",
          }
          stop = {"insurance", "general", "company", "limited", "ltd", "co", "the", "of", "india"}
          excluded = {"facebook.com", "linkedin.com", "youtube.com", "youtu.be", "twitter.com", "x.com", "instagram.com", "google.com", "google.co.in", "goo.gl"}
          domain_re = re.compile(r"(?i)(?:https?://)?(?:www\.)?([a-z0-9][a-z0-9.-]*\.(?:co\.in|com|in|org|net))")

          engine = CaptureEngine()
          engine.capture_screenshot_only = lambda _url: None
          source_runner = SourceDiscoveryRunner()

          def opaque(value):
              return "sha256:" + hashlib.sha256(value.encode()).hexdigest()

          def host_key(value):
              raw = value.strip().lower()
              if not raw.startswith(("http://", "https://")):
                  raw = "https://" + raw
              host = (urlparse(raw).hostname or "").lower().strip(".")
              return host[4:] if host.startswith("www.") else host

          def is_irdai(host):
              return host == "irdai.gov.in" or host.endswith(".irdai.gov.in")

          def tokens(value):
              return {x for x in re.findall(r"[a-z0-9]+", value.lower()) if x not in stop}

          required = {cid: tokens(name) for cid, name in candidates.items()}
          def matches(cid, text):
              return required[cid].issubset(tokens(text))

          def capture(url):
              sink = io.StringIO()
              with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                  return engine.capture(url)

          directory_urls = {}
          for root in roots:
              result = capture(root)
              if not engine.is_valid_capture(result):
                  continue
              soup = BeautifulSoup(result.get("html", ""), "lxml")
              for link in soup.find_all("a"):
                  href = link.get("href")
                  if not href:
                      continue
                  absolute = urljoin(root, href)
                  parsed = urlparse(absolute)
                  if parsed.scheme not in {"http", "https"} or not parsed.netloc or not is_irdai(host_key(absolute)):
                      continue
                  anchor = link.get_text(" ", strip=True)
                  if source_runner.source_noise_skip_reason(absolute, anchor):
                      continue
                  page_type = source_runner.classify_source_url(absolute, anchor, "regulator")
                  if page_type != "insurer_directory":
                      continue
                  record = {
                      "source_id": "irdai_regulator", "insurer_id": "irdai_regulator",
                      "source_url": root, "discovered_url": absolute, "anchor_text": anchor,
                      "page_type": "insurer_directory", "knowledge_value": "high",
                      "crawl": True, "priority": 1, "status": "new",
                      "discovery_origin": "captured_html",
                  }
                  projection = BlindDiscoveryLinkProjector.project(record).to_dict()
                  directory_urls[projection["destination_id"]] = absolute

          metrics = {cid: {
              "pages_with_identity": 0,
              "matching_element_count": 0,
              "matching_row_count": 0,
              "matching_element_with_external_href_count": 0,
              "matching_element_with_domain_signal_count": 0,
              "minimal_scope_domain_count": None,
              "minimal_scope_domain_ids": [],
              "minimal_scope_tag": None,
          } for cid in candidates}

          captured = 0
          for _, raw_url in sorted(directory_urls.items()):
              result = capture(raw_url)
              if not engine.is_valid_capture(result):
                  continue
              captured += 1
              soup = BeautifulSoup(result.get("html", ""), "lxml")
              page_text = soup.get_text(" ", strip=True)
              for cid in candidates:
                  if not matches(cid, page_text):
                      continue
                  metrics[cid]["pages_with_identity"] += 1
                  scopes = []
                  for element in soup.find_all(["tr", "li", "article", "section", "div", "td", "tbody", "table"]):
                      if not matches(cid, element.get_text(" ", strip=True)):
                          continue
                      metrics[cid]["matching_element_count"] += 1
                      if element.name == "tr":
                          metrics[cid]["matching_row_count"] += 1
                      external_href = False
                      for link in element.find_all("a"):
                          href = link.get("href")
                          if not href:
                              continue
                          absolute = urljoin(raw_url, href)
                          parsed = urlparse(absolute)
                          if parsed.scheme in {"http", "https"} and parsed.netloc:
                              host = host_key(absolute)
                              if host and not is_irdai(host) and host not in excluded:
                                  external_href = True
                      if external_href:
                          metrics[cid]["matching_element_with_external_href_count"] += 1

                      domains = set()
                      for match in domain_re.finditer(str(element)):
                          host = host_key(match.group(1))
                          if host and not is_irdai(host) and host not in excluded:
                              domains.add(host)
                      if domains:
                          metrics[cid]["matching_element_with_domain_signal_count"] += 1
                          scopes.append((len(str(element)), element.name, domains))

                  if scopes:
                      _, tag, domains = sorted(scopes, key=lambda x: (x[0], x[1]))[0]
                      metrics[cid]["minimal_scope_domain_count"] = len(domains)
                      metrics[cid]["minimal_scope_domain_ids"] = sorted(opaque(x) for x in domains)
                      metrics[cid]["minimal_scope_tag"] = tag

          print("PRODUCT11_GATE_B_ORIGIN_SIGNAL_DIAGNOSTIC=" + json.dumps({
              "directory_projection_count": len(directory_urls),
              "directory_capture_count": captured,
              "candidate_metrics": metrics,
              "raw_directory_urls_emitted": 0,
              "raw_domains_emitted": 0,
              "anchor_text_emitted": 0,
              "body_text_emitted": 0,
              "product_screening_started": False,
              "product_selected": False,
              "target_clause_reads": 0,
          }, sort_keys=True))
          PY
